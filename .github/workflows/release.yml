name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  # Required by actions/attest-build-provenance so the release assets can carry
  # a signed provenance attestation users can verify against this repository.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Check version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match manifest.json version $version"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --run

      - name: Build
        run: npm run build

      # Obsidian Sync's Standard plan cannot sync files larger than 5 MB, so a
      # bloated bundle would make the plugin uninstallable for those users.
      - name: Check bundle size
        run: |
          size=$(stat -c %s main.js)
          limit=$((5 * 1024 * 1024))
          echo "main.js is ${size} bytes (limit ${limit})"
          if [ "$size" -gt "$limit" ]; then
            echo "::error file=main.js::main.js exceeds the 5 MB Obsidian Sync limit"
            exit 1
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
          fail_on_unmatched_files: true
          generate_release_notes: true
